[project]
name = "small-model-agents"
version = "0.1.0"
description = "Reliable multi-agent tool calling on a small model, by giving the model less to decide"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Muhammed Salim K T", email = "mohdsalimkt@gmail.com" }]
license = { text = "MIT" }
keywords = ["llm", "agents", "rag", "tool-calling", "mcp", "vllm", "orchestration"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
examples = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/salimkt/small-model-agents"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/small_model_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
